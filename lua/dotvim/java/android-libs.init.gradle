// jdtls用: AndroidモジュールのコンパイルクラスパスをJARパスの一覧として書き出す。
// lua/dotvim/java/jdtls.lua がこの一覧から .classpath を生成する。
//
// 通常は nvim の :JdtlsAndroidLibs [module ...] から実行する。このファイルの場所や
// 以下のプロパティを意識する必要はない。build.gradle の依存を変えたら再実行する。
// variant は .nvim.lua の vim.g.dotvim_jdtls.android から、R.jar の事前生成
// (process<Variant>Resources)、.classpath の再生成、jdtls の再起動もまとめて行う。
//
// プロパティ:
//   -Pjdtls.variant    対象バリアント(flavor+buildType の camelCase。既定 debug)
//   -Pjdtls.outPrefix  出力先のパス接頭辞。<outPrefix><モジュール名>.txt に書く。
//                      省略時は ~/.cache/nvim/jdtls-libs/<ルートディレクトリ名>-<モジュール名>.txt

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { p ->
        def isAndroid = p.plugins.hasPlugin('com.android.application') || p.plugins.hasPlugin('com.android.library')
        if (!isAndroid) {
            return
        }
        // 対象バリアント(build type / flavor)。既定は debug。
        // 例: -Pjdtls.variant=demoDebug
        def variant = (p.findProperty('jdtls.variant') ?: 'debug').toString()
        def processResources = "process${variant.capitalize()}Resources".toString()
        p.tasks.register('jdtlsLibs') { task ->
            task.notCompatibleWithConfigurationCache('doLast で Project を参照する')
            // コマンドラインの並び順だけでは、configuration cache 有効時に R.jar の
            // 生成より先に実行されうる。
            task.mustRunAfter(p.tasks.matching { it.name == processResources })
            doLast {
                def lines = []

                // android.jar(コンパイルSDKのブートクラスパス)。
                // AGP 9 で android.bootClasspath / android.sdkDirectory が拡張DSLから
                // 削除されたため、公開APIの androidComponents.sdkComponents から SDK
                // ディレクトリを取得し、compileSdkVersion(例 android-36)配下の
                // android.jar を直接指す(AGP 7.2+〜9 で共通に動く)。
                def sdkDir = p.extensions.getByName('androidComponents').sdkComponents.sdkDirectory.get().asFile
                def androidJar = new File(sdkDir, "platforms/${p.android.compileSdkVersion}/android.jar")
                if (androidJar.exists()) {
                    lines << androidJar.absolutePath
                } else {
                    logger.warn("jdtlsLibs: android.jar が見つかりません(${androidJar})。compileSdk(${p.android.compileSdkVersion})のプラットフォームをインストールしてください。")
                }

                // LambdaMetafactoryのスタブ。android.jarには含まれない(実機では
                // desugaringされる)ため、これが無いとラムダを含むコードのjdt診断で
                // "LambdaMetafactory cannot be resolved" が出る。
                def lambdaStubs = new File(sdkDir,
                        "build-tools/${p.android.buildToolsVersion}/core-lambda-stubs.jar")
                if (lambdaStubs.exists()) {
                    lines << lambdaStubs.absolutePath
                }

                // R.jar(aapt生成のリソースIDクラス。対象バリアントのもの)
                def rJarDir = new File(p.layout.buildDirectory.get().asFile, "intermediates/compile_and_runtime_r_class_jar/${variant}")
                def rJars = rJarDir.exists() ? p.fileTree(dir: rJarDir, include: '**/R.jar').files : []
                if (rJars.empty) {
                    def processTask = p.tasks.findByName(processResources)
                    if (processTask != null && gradle.taskGraph.hasTask(processTask)) {
                        logger.warn("jdtlsLibs: ${processResources} の実行後も R.jar が見つかりません(${rJarDir})。")
                    } else {
                        def taskPath = p.path == ':' ? ":${processResources}" : "${p.path}:${processResources}"
                        logger.warn("jdtlsLibs: R.jar が見つかりません(${rJarDir})。${taskPath} を同じ実行に含めてください。")
                    }
                }
                rJars.each { lines << it.absolutePath }

                // 依存ライブラリ。AARのままではjdtが読めないため、artifactViewで
                // クラスJAR(android-classes-jar)に変換されたものを解決する。
                def artifactType = Attribute.of('artifactType', String)
                def jars = p.configurations.getByName("${variant}CompileClasspath").incoming
                        .artifactView { it.attributes.attribute(artifactType, 'android-classes-jar') }
                        .files.files.sort()
                jars.each { lines << it.absolutePath }

                def outPrefix = p.findProperty('jdtls.outPrefix')
                def out = outPrefix
                        ? new File("${outPrefix}${p.name}.txt".toString())
                        : new File(System.getProperty('user.home'),
                                ".cache/nvim/jdtls-libs/${p.rootProject.projectDir.name}-${p.name}.txt")
                out.parentFile.mkdirs()
                out.text = lines.join('\n') + '\n'
                println "jdtlsLibs: ${lines.size()} entries -> ${out}"
            }
        }
    }
}
